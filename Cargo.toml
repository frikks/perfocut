[workspace]
members = ["core", "app"]
resolver = "2"

# Единая версия программы. Поменяйте её и отправьте в main: GitHub соберёт релиз vX.Y.Z.
[workspace.package]
version = "0.4.1"
edition = "2021"

# prerelease = true: GitHub выпустит версию как предварительную (Pre-release)
[workspace.metadata.release]
prerelease = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Быстрая сборка для проверки: зависимости оптимизированы, своя программа собирается быстро
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
