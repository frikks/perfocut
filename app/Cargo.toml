[package]
name = "perfocut"
version.workspace = true
edition.workspace = true

# Для Android и браузера библиотеку собирают как cdylib: cargo rustc --lib --crate-type cdylib
[lib]
path = "src/lib.rs"

[[bin]]
name = "perfocut"
path = "src/main.rs"

[dependencies]
perfo_core = { path = "../core" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-software", "renderer-femtovg", "unstable-winit-030"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
sys-locale = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg"] }
# wasm-bindgen-cli в сборке берётся той же версии
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "Navigator", "Element", "HtmlElement", "Location", "Node", "DragEvent", "DataTransfer", "Event", "EventTarget", "MediaQueryList", "Response"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
slint-build = "=1.18.1"
miniz_oxide = "0.8"
