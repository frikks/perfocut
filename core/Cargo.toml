[package]
name = "perfo_core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Триангуляция плоских граней с отверстиями (верх и низ листа в STL/STEP)
earcutr = "0.4"
# Распаковка Deflate в архивах .perfo / .zip
miniz_oxide = "0.8"
