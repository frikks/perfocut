name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo.html'
      - '.nojekyll'
      - 'screenshots/**'
      - 'docs/landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать статический сайт
        run: |
          mkdir -p _site
          cp index.html demo.html .nojekyll _site/
          cp -r screenshots _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
