name: Release

# Релиз собирается сам, когда в main приходит новая версия из Cargo.toml.
# Если релиз с такой версией уже есть, сборка только проверяет код.
on:
  push:
    branches: [main]
    # README и заметки к релизу не требуют новой сборки
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          # prerelease = true в [workspace.metadata.release] выпускает предварительную версию
          if grep -Eq '^prerelease *= *true' Cargo.toml; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          echo "Версия $V"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Системные пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 libfontconfig1-dev libxkbcommon-dev >/dev/null

      - name: Тесты
        run: cargo test --workspace

      - name: Windows .exe
        run: |
          cargo build --release -p perfocut --bin perfocut --target x86_64-pc-windows-gnu
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/perfocut.exe dist/PerfoCut.exe

      - name: HTML (WebAssembly)
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WB/wasm-bindgen-$WB-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          export PATH="/tmp/wasm-bindgen-$WB-x86_64-unknown-linux-musl:$PATH"
          python3 web/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android .apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          [ -n "$ANDROID_KEYSTORE_PASS" ] || unset ANDROID_KEYSTORE_PASS
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          bash android/build.sh

      - name: Контрольные суммы SHA-256
        run: |
          cd dist
          sha256sum PerfoCut.exe PerfoCut.apk PerfoCut.html > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: PerfoCut-${{ steps.v.outputs.version }}
          path: dist/*

      # Скриншоты снимаются с готовой HTML-версии в Chrome без окна и попадают в docs/screenshots
      - name: Скриншоты
        if: steps.v.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npm install --silent --no-save --no-package-lock --prefix /tmp/pw playwright-core@1
          SHOTS_SLOW=1.5 NODE_PATH=/tmp/pw/node_modules CHROME=$(command -v google-chrome || command -v chromium) node web/shots.js dist/PerfoCut.html docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -q -m "Скриншоты ${{ steps.v.outputs.version }} [skip ci]"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi

      - name: Релиз на GitHub
        if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: PerfoCut ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
          generate_release_notes: true
          body_path: docs/release-notes.md
          files: |
            dist/PerfoCut.exe
            dist/PerfoCut.apk
            dist/PerfoCut.html
            dist/SHA256SUMS.txt
