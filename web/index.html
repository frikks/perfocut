<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>PerfoCut {{VERSION}}</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141415; }
  @media (prefers-color-scheme: light) { html, body { background: #f4f4f2; } }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          font: 14px system-ui, sans-serif; color: #8a8a8e; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="boot">PerfoCut {{VERSION}}…</div>
<script>
{{GLUE}}
</script>
<script>
(async () => {
  const boot = document.getElementById("boot");
  try {
    if (!("DecompressionStream" in window) || !window.WebAssembly) throw new Error("old");
    const raw = Uint8Array.from(atob("{{WASM_GZ_B64}}"), (c) => c.charCodeAt(0));
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
    const bytes = await new Response(stream).arrayBuffer();
    await wasm_bindgen({ module_or_path: bytes });
    boot.remove();
  } catch (e) {
    // winit запускает цикл событий через исключение: это не ошибка
    if (String(e).includes("control flow")) { boot.remove(); return; }
    boot.textContent = e && e.message === "old"
      ? "Браузер устарел. Откройте файл в свежем Chrome, Edge, Firefox или Safari."
      : "Не удалось запустить PerfoCut: " + e;
    console.error(e);
  }
})();
</script>
<script id="worker-glue" type="text/plain">{{WORKER_GLUE}}</script>
<script>
(() => {
  const glue = document.getElementById("worker-glue").textContent;
  const wasmB64 = "{{WORKER_WASM_GZ_B64}}";
  const src = glue + `
let ready = false;
async function init() {
  const raw = Uint8Array.from(atob("` + wasmB64 + `"), (c) => c.charCodeAt(0));
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
  const bytes = await new Response(stream).arrayBuffer();
  await wasm_bindgen({ module_or_path: bytes });
  ready = true;
}
onmessage = async (e) => {
  try {
    if (!ready) await init();
    const d = e.data;
    const json = wasm_bindgen.generate(new Uint8Array(d.rgba), d.w, d.h, d.paramsJson);
    postMessage({ ver: d.ver, json });
  } catch (err) {
    postMessage({ ver: e.data.ver, json: "ERR:" + (err && err.message ? err.message : err) });
  }
};`;
  let worker;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  } catch (e) {
    // Worker недоступен — приложение продолжит работать без фонового расчёта
    window.__perfocutGenStart = () => {};
    return;
  }
  worker.onmessage = (e) => wasm_bindgen.worker_result(e.data.ver, e.data.json);
  window.__perfocutGenStart = (ver, w, h, paramsJson, rgba) => {
    worker.postMessage({ ver, w, h, paramsJson, rgba: Array.from(rgba) });
  };
})();
</script>
</body>
</html>
